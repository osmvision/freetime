# Built-in ideas. Add your own: they are compiled into the app.
#
# category: game | video | sport | learn | create | chill | social | food
# energy:   low | medium | high
# social:   solo | group | either
# cost:     free | cheap | paid
# min/max:  typical session length in minutes
# quality:  0..1, how good an idea it usually is (default 0.6)
# tag "night": shines after dark (stargazing)


fr = "Je suis un nombre : multiplié par 3 puis plus 4, je fais 19. Qui suis-je ?"
fr_choices = ["4", "5", "6", "7"]
fr_why = "5 × 3 = 15, et 15 + 4 = 19."
en = "I'm a number: times 3, plus 4, makes 19. What am I?"
en_choices = ["4", "5", "6", "7"]
en_why = "5 × 3 = 15, and 15 + 4 = 19."

[[q]]
topic = "logic"
answer = 2
fr = "Quel nombre continue la suite 1, 1, 2, 3, 5, 8… ?"
fr_choices = ["10", "11", "13", "16"]
fr_why = "Chaque nombre est la somme des deux précédents : 5 + 8 = 13. C'est la suite de Fibonacci."
en = "Which number comes next: 1, 1, 2, 3, 5, 8…?"
en_choices = ["10", "11", "13", "16"]
en_why = "Each number is the sum of the two before: 5 + 8 = 13. It's the Fibonacci sequence."

[[q]]
topic = "logic"
answer = 3
fr = "Un escargot grimpe un mur de 10 m : +3 m le jour, -2 m la nuit. Combien de jours pour arriver en haut ?"
fr_choices = ["10", "5", "9", "8"]
fr_why = "Après 7 jours il est à 7 m ; le 8e jour il grimpe de 3 m et atteint le sommet."
en = "A snail climbs a 10 m wall: up 3 m by day, down 2 m by night. How many days to reach the top?"
en_choices = ["10", "5", "9", "8"]
en_why = "After 7 days it's at 7 m; on day 8 it climbs 3 m and reaches the top."


# Questions for the daily quiz (5 a day, the same for everyone; see core/src/quiz.rs).
# Each question: French and English text, 4 choices in the same order, `answer` = index (0 to 3)
# of the right choice, and a short "why" shown after answering. Keep facts well established.

# ---------------------------------------------------------------- space

[[q]]
topic = "space"
answer = 1
fr = "Quelle planète est la plus proche du Soleil ?"
fr_choices = ["Vénus", "Mercure", "Mars", "La Terre"]
fr_why = "Mercure fait le tour du Soleil en seulement 88 jours."
en = "Which planet is closest to the Sun?"
en_choices = ["Venus", "Mercury", "Mars", "Earth"]
en_why = "Mercury goes around the Sun in just 88 days."

[[q]]
topic = "space"
answer = 3
fr = "Quelle est la plus grande planète du système solaire ?"
fr_choices = ["Saturne", "Neptune", "La Terre", "Jupiter"]
fr_why = "Plus de 1 300 Terre pourraient tenir à l'intérieur de Jupiter."
en = "What is the largest planet in the solar system?"
en_choices = ["Saturn", "Neptune", "Earth", "Jupiter"]
en_why = "More than 1,300 Earths could fit inside Jupiter."

[[q]]
topic = "space"
answer = 1
fr = "Combien de temps met la lumière du Soleil pour arriver jusqu'à nous ?"
fr_choices = ["8 secondes", "8 minutes", "8 heures", "1 jour"]
fr_why = "Environ 8 minutes et 20 secondes : on voit toujours le Soleil avec un peu de retard."
en = "How long does sunlight take to reach Earth?"
en_choices = ["8 seconds", "8 minutes", "8 hours", "1 day"]
en_why = "About 8 minutes and 20 seconds: we always see the Sun slightly in the past."

[[q]]
topic = "space"
answer = 0

fr_choices = ["Buzz Aldrin", "Youri Gagarine", "Neil Armstrong", "Thomas Pesquet"]
fr_why = "Neil Armstrong est sorti le premier ; Buzz Aldrin l'a suivi une vingtaine de minutes plus tard."

[[q]]
topic = "space"
answer = 3
fr = "Combien de temps la Terre met-elle pour faire le tour du Soleil ?"
fr_choices = ["24 heures", "30 jours", "100 jours", "Environ 365 jours"]
fr_why = "Environ 365 jours et 6 heures : d'où une année bissextile tous les 4 ans."
en = "How long does the Earth take to go around the Sun?"
en_choices = ["24 hours", "30 days", "100 days", "About 365 days"]
en_why = "About 365 days and 6 hours: hence a leap year every 4 years."

[[q]]
topic = "space"

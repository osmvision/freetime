name: Accessibility barrier
description: Something in freetime is hard or impossible for you to use.
labels: [accessibility]
body:
  - type: markdown
    attributes:
      value: |
        Thank you: we treat barriers as bugs. See [ACCESSIBILITY.md](https://github.com/osmvision/freetime/blob/main/ACCESSIBILITY.md) for what we aim for and what we already know about.
  - type: textarea
    id: task
    attributes:
      label: What were you trying to do?
      placeholder: Play a game of Reversi against the computer.
    validations:
      required: true
  - type: textarea
    id: barrier
    attributes:
      label: What got in the way?
      placeholder: My screen reader doesn't say which squares I can play.
    validations:
      required: true
  - type: input
    id: tools
    attributes:
      label: What do you use?
      description: Screen reader, zoom or text size, keyboard only, switch access, high contrast...
      placeholder: NVDA with Firefox, keyboard only
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - Desktop app (Windows)
        - Web version
    validations:
      required: true

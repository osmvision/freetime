name: Website

# Builds site/ (plus the app's photos, fonts and privacy policy) and publishes it on GitHub Pages:
# https://osmvision.github.io/freetime/

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/privacy.md'
      - 'docs/code-signing.md'
      - 'core/data/activities.toml'
      - 'desktop/ui/img/ideas/**'
      - 'desktop/ui/js/i18n-fr.js'
      - 'desktop/ui/support.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install markdown==3.11 pillow==12.0.0
      - run: python site/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

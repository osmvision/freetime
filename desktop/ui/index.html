<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>freetime</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="wordmark" aria-label="freetime">
          <span class="wordmark-mark" data-icon="ticket"></span>
          <span class="wordmark-text">freetime</span>
        </div>
        <nav class="nav" aria-label="Main">
          <button class="nav-item" data-view="discover" aria-current="page" title="Discover (Alt+1)">
            <span data-icon="compass"></span><span class="nav-label">Discover</span>
          </button>
          <button class="nav-item" data-view="history" title="History (Alt+2)">
            <span data-icon="history"></span><span class="nav-label">History</span>
          </button>
          <button class="nav-item" data-view="settings" title="Settings (Alt+3)">
            <span data-icon="sliders-horizontal"></span><span class="nav-label">Settings</span>
          </button>
        </nav>
        <div class="bar-tags" id="bar-tags" aria-live="polite"></div>
      </header>

      <main class="main" id="main">
        <section class="view" id="view-discover"></section>
        <section class="view" id="view-history" hidden></section>
        <section class="view" id="view-settings" hidden></section>
      </main>
    </div>
    <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  </body>
</html>

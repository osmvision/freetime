<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>freetime</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <div class="app">
      <nav class="sidebar" aria-label="Main">
        <div class="brand">
          <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
            <defs>
              <linearGradient id="ft-grad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#7c5cff" />
                <stop offset="0.55" stop-color="#ff5d8f" />
                <stop offset="1" stop-color="#ffb84d" />
              </linearGradient>
            </defs>
            <rect x="4" y="4" width="56" height="56" rx="12.5" fill="url(#ft-grad)" />
            <circle cx="32" cy="33.75" r="15.6" fill="none" stroke="#fff" stroke-width="3.75" />
            <path d="M32 33.75 L24.4 29.4 M32 33.75 L42.3 27.8" stroke="#fff" stroke-width="3.25" stroke-linecap="round" />
            <circle cx="32" cy="33.75" r="2.5" fill="#fff" />
            <path d="M49.4 10 Q49.4 15.6 55 15.6 Q49.4 15.6 49.4 21.2 Q49.4 15.6 43.8 15.6 Q49.4 15.6 49.4 10 Z" fill="#fff" />
          </svg>
          <span>freetime</span>
        </div>

        <button class="nav-item active" data-view="discover" aria-current="page" title="Discover">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3l1.8 4.9 4.9 1.8-4.9 1.8L12 16.4l-1.8-4.9-4.9-1.8 4.9-1.8z" />
            <path d="M19 15.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z" />
          </svg>
          <span>Discover</span>
        </button>
        <button class="nav-item" data-view="history" title="History">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1" />
            <path d="M3.5 4.5v4h4" />
            <path d="M12 7.5V12l3 2" />
          </svg>
          <span>History</span>
        </button>
        <button class="nav-item" data-view="settings" title="Settings">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 7h9M17 7h3M4 17h3M11 17h9" />
            <circle cx="15" cy="7" r="2" />
            <circle cx="9" cy="17" r="2" />
          </svg>
          <span>Settings</span>
        </button>

        <div class="sidebar-foot" id="sync" title="Steam, YouTube and weather sync"></div>
      </nav>

      <main class="main" id="main">
        <section class="view" id="view-discover"></section>
        <section class="view" id="view-history" hidden></section>
        <section class="view" id="view-settings" hidden></section>
      </main>
    </div>

    <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  </body>
</html>

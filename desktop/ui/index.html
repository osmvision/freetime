<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>freetime</title>
    <script src="js/boot-display.js"></script>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="wordmark" aria-label="freetime">
          <span class="wordmark-mark" data-icon="ticket"></span>
          <span class="wordmark-text">freetime</span>
        </div>
        <nav class="nav" aria-label="Main">
          <button class="nav-item" data-view="discover" aria-current="page" title="Discover (Alt+1)">
            <span data-icon="compass"></span><span class="nav-label">Discover</span>
          </button>
          <button class="nav-item nav-games" data-view="games" title="Games (Alt+Q)">
            <span data-icon="swords"></span><span class="nav-label">Games</span><span class="nav-dot" id="quiz-dot" hidden></span>
          </button>
          <button class="nav-item" data-view="friends" title="Friends (Alt+2)">
            <span data-icon="users"></span><span class="nav-label">Friends</span><span class="nav-badge" id="invites-badge" hidden></span>
          </button>
          <button class="nav-item" data-view="messages" title="Messages (Alt+3)">
            <span data-icon="message-circle"></span><span class="nav-label">Messages</span><span class="nav-badge" id="unread-badge" hidden></span>
          </button>
          <button class="nav-item" data-view="history" title="History (Alt+4)">
            <span data-icon="history"></span><span class="nav-label">History</span>
          </button>
          <button class="nav-item" data-view="settings" title="Settings (Alt+5)">
            <span data-icon="sliders-horizontal"></span><span class="nav-label">Settings</span>
          </button>
          <button class="nav-item" data-view="tickets" id="tickets-tab" title="Tickets (admins)" hidden>
            <span data-icon="flag"></span><span class="nav-label">Tickets</span><span class="nav-badge" id="tickets-badge" hidden></span>
          </button>
        </nav>
        <div class="bar-tags" id="bar-tags" aria-live="polite"></div>
        <button class="me-chip" id="me-chip" type="button" hidden></button>
      </header>

      <main class="main" id="main">
        <section class="view" id="view-discover"></section>
        <section class="view" id="view-games" hidden></section>
        <section class="view" id="view-friends" hidden></section>
        <section class="view wide" id="view-messages" hidden></section>
        <section class="view" id="view-history" hidden></section>
        <section class="view" id="view-settings" hidden></section>
        <section class="view" id="view-tickets" hidden></section>
      </main>
    </div>
    <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  </body>
</html>

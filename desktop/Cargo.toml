[package]
name = "freetime-desktop"
version = "0.3.1"
edition = "2021"
description = "freetime desktop app: find the best thing to do with your free time."
license = "MIT"

# The program is freetime.exe (the package keeps its name: `cargo run -p freetime-desktop`).
[[bin]]
name = "freetime"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = "0.4"
freetime-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
# tauri::generate_context! needs it once tauri.conf.json has plugin settings.
serde_json = "1"
# Shuffles the bonus quiz answers.
rand = "0.8"
tauri = { version = "2", features = [] }
# Windows notifications for new messages (only while signed in, and only if enabled).
tauri-plugin-notification = "2"
# Signed auto-updates from GitHub releases (see src/updates.rs).
tauri-plugin-updater = "2"

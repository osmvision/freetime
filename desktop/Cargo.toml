[package]
name = "freetime-desktop"
version = "0.1.0"
edition = "2021"
description = "freetime desktop app: find the best thing to do with your free time."
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = "0.4"
freetime-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

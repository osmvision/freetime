[package]
name = "freetime"
version = "0.1.0"
edition = "2021"
description = "Got free time? Get the best thing to do with it, from your terminal."
license = "MIT"

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
console = "0.15"
dialoguer = "0.11"
freetime-core = { path = "../core", features = ["clap"] }
